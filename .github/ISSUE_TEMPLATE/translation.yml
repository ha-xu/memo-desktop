name: Translation / 翻译反馈
description: 报告翻译、文本方向或本地化显示问题
title: "[i18n] "
body:
  - type: input
    id: language
    attributes:
      label: 语言 / Language
      placeholder: العربية (ar)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本 / App version
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前文本或布局 / Current text or layout
      description: 请指出页面、按钮或语言文件的 key，可附无敏感信息的截图。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改 / Suggested change
      description: 说明更自然的译法或预期的 RTL / LTR 排列。
    validations:
      required: true
