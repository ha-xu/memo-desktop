name: Feature request / 功能建议
description: 建议新的能力或改进现有使用流程
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？ / Problem
      description: 描述使用场景、当前不便之处和受影响用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为 / Proposal
      description: 说明操作前后会有什么变化；可附简单示意图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 已尝试的做法，或不增加此功能时的处理方法。
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Context
      description: 涉及窗口、多屏、MCP、RTL 或数据兼容时请说明。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，并说明了具体使用场景。
          required: true
