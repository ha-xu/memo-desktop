name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and release tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Prepare verified Electron runtime
        run: npm run runtime

      - name: Language and RTL window checks
        run: npm run check:i18n

      - name: Display and docking window checks
        run: npm run check:dpi

      - name: Build Windows x64 installer
        run: npm run package:win

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memo-desktop-windows-x64-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Download installer to verify artifact compatibility
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: memo-desktop-windows-x64-${{ github.run_number }}
          path: ${{ runner.temp }}/memo-artifact-check

      - name: Verify downloaded installer hashes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.exe(\.blockmap)?$' })
          if ($files.Count -ne 2) { throw 'Expected one installer and its blockmap' }
          foreach ($file in $files) {
            $download = Join-Path $env:RUNNER_TEMP "memo-artifact-check/$($file.Name)"
            if ((Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $download).Hash) {
              throw "Artifact checksum mismatch: $($file.Name)"
            }
          }

      - name: Upload isolated UI test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-checks-${{ github.run_number }}
          path: work/i18n-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
